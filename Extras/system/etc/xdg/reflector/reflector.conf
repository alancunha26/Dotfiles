# Used by reflector.service (run weekly by reflector.timer) to rewrite the
# pacman mirror list from Arch's live mirror status. Because of this,
# /etc/pacman.d/mirrorlist.pacnew is never needed: just delete it.
#
# Brazilian mirrors first, US mirrors as the fallback: only HTTPS mirrors
# synced in the last 12 hours, ordered by country in the order given, keeping
# the first 20. (No --fastest: it would rank both countries together and could
# drop a Brazilian mirror before the country ordering happens.)
--save /etc/pacman.d/mirrorlist
--protocol https
--country BR,US
--age 12
--sort country
--number 20
