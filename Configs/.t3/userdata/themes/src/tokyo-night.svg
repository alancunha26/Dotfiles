<svg xmlns='http://www.w3.org/2000/svg'>
<style>
image { image-rendering: pixelated; }
.a { fill: #828bb8; }
.b { fill: #c8d3f5; }
.t1 { animation: tw 8.4s steps(2) infinite; }
.t2 { animation: tw 10.6s steps(2) infinite 1.1s; }
.t3 { animation: tw 12.8s steps(2) infinite 2.3s; }
.t4 { animation: tw 14.2s steps(2) infinite 3.7s; }
@keyframes tw { 50% { opacity: .2; } }
.shoot { fill: #c8d3f5; opacity: 0; animation: shoot 23s steps(24) infinite 6s; }
@keyframes shoot {
  0% { opacity: 0; transform: translate(0, 0); }
  1% { opacity: .9; }
  4% { opacity: 0; transform: translate(-240px, 120px); }
  100% { opacity: 0; transform: translate(-240px, 120px); }
}
.scene { transform: translateY(100vh) scale(3); }
.stars { animation: drift 400s steps(80) infinite alternate; }
@keyframes drift { to { transform: translate(-70px, -18px); } }
.mw { fill: #c99a4e; }
.mw1, .mw2, .mw3, .mw4 { opacity: 0; animation: mw 23s steps(1, end) infinite -4s; }
.mw2 { animation-duration: 31s; animation-delay: -19s; }
.mw3 { animation-duration: 41s; animation-delay: -8s; }
.mw4 { animation-duration: 53s; animation-delay: -33s; }
@keyframes mw { 0% { opacity: 0; } 30% { opacity: 1; } 72%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>
