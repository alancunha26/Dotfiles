<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>
<style>
image { image-rendering: pixelated; }
.glow { transform-box: fill-box; transform-origin: center; animation: glow 4.5s steps(6) infinite alternate; }
.glow2 { animation-duration: 6.5s; animation-delay: -3s; }
@keyframes glow { from { opacity: .35; transform: scale(.82); } to { opacity: 1; transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>
<radialGradient id='glow'>
  <stop offset='0' stop-color='#ffc777' stop-opacity='.34'/>
  <stop offset='1' stop-color='#ffc777' stop-opacity='0'/>
</radialGradient>
<circle class='glow' fill='url(#glow)' cx='120' cy='120' r='90'/>
<circle class='glow glow2' fill='url(#glow)' cx='120' cy='120' r='56'/>
<image href='sprite:moon' x='87' y='87' width='66' height='66'/>
</svg>
