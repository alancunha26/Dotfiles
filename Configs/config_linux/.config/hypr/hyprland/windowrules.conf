# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hypr.land/Configuring/Window-Rules/

# idleinhibit rules
windowrule = idle_inhibit fullscreen, match:class .*celluloid.*|.*mpv.*|.*vlc.*
windowrule = idle_inhibit fullscreen, match:class .*[Ss]potify.*
windowrule = idle_inhibit fullscreen, match:class .*LibreWolf.*|.*floorp.*|.*brave-browser.*|.*firefox.*|.*chromium.*|.*zen.*|.*vivaldi.*

# Picture-in-Picture
windowrule = float on, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = keep_aspect_ratio on, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = move 73% 72%, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = size 25% 25%, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = pin on, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*

windowrule = float on, match:class org.kde.dolphin, match:title Progress Dialog — Dolphin
windowrule = float on, match:class org.kde.dolphin, match:title Copying — Dolphin
windowrule = float on, match:title About Mozilla Firefox
windowrule = float on, match:class firefox, match:title Picture-in-Picture
windowrule = float on, match:class firefox, match:title Library
windowrule = float on, match:class top
windowrule = float on, match:class htop
windowrule = float on, match:class vlc
windowrule = float on, match:class kvantummanager
windowrule = float on, match:class qt5ct
windowrule = float on, match:class qt6ct
windowrule = float on, match:class nwg-look
windowrule = float on, match:class org.kde.ark
windowrule = float on, match:class org.pulseaudio.pavucontrol
windowrule = float on, match:class nm-applet
windowrule = float on, match:class Signal
windowrule = float on, match:class com.github.rafostar.Clapper
windowrule = float on, match:class app.drey.Warp
windowrule = float on, match:class net.davidotek.pupgui2
windowrule = float on, match:class yad
windowrule = float on, match:class eog
windowrule = float on, match:class io.github.alainm23.planify
windowrule = float on, match:class io.gitlab.theevilskeleton.Upscaler
windowrule = float on, match:class com.github.unrud.VideoDownloader
windowrule = float on, match:class io.gitlab.adhami3310.Impression
windowrule = float on, match:class io.missioncenter.MissionCenter
windowrule = float on, match:class org.gnome.Nautilus
windowrule = float on, match:class org.pwmt.zathura
windowrule = float on, match:class zoom

# Float Steam, fullscreen RetroArch
windowrule = float on, match:class steam
windowrule = center on, match:class steam, match:title Steam
windowrule = opacity 1 1, match:class steam
windowrule = size 1100 700, match:class steam, match:title Steam
windowrule = size 460 800, match:class steam, match:title Friends List

# Floating with custom sizes
windowrule = float on, match:class mpv
windowrule = size 50% 50%, match:class mpv

windowrule = float on, match:class nm-connection-editor
windowrule = size 50% 50%, match:class nm-connection-editor

windowrule = float on, match:class wiremix
windowrule = size 50% 50%, match:class wiremix

windowrule = float on, match:class top
windowrule = size 50% 50%, match:class top

windowrule = float on, match:class htop
windowrule = size 50% 50%, match:class htop

windowrule = float on, match:class btop
windowrule = size 50% 50%, match:class btop

windowrule = float on, match:class yazi
windowrule = size 75% 75%, match:class yazi

windowrule = float on, match:class org.corectrl.CoreCtrl
windowrule = size 75% 75%, match:class org.corectrl.CoreCtrl

# common modals
windowrule = float on, match:title Open
windowrule = float on, match:title Authentication Required
windowrule = float on, match:title Add Folder to Workspace
windowrule = float on, match:title Open File
windowrule = float on, match:title Choose Files
windowrule = float on, match:title Save As
windowrule = float on, match:title Confirm to replace files
windowrule = float on, match:title File Operation Progress
windowrule = float on, match:class [Xx]dg-desktop-portal-gtk
windowrule = float on, match:title File Upload.*
windowrule = float on, match:title Choose wallpaper.*
windowrule = float on, match:title Library.*
windowrule = float on, match:class .*dialog.*
windowrule = float on, match:title .*dialog.*

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# XWayland Video Bridge - hide main window when sharing screen
windowrule = opacity 0.0 override, match:class xwaylandvideobridge
windowrule = no_anim on, match:class xwaylandvideobridge
windowrule = no_initial_focus on, match:class xwaylandvideobridge
windowrule = max_size 1 1, match:class xwaylandvideobridge
windowrule = no_blur on, match:class xwaylandvideobridge
windowrule = no_focus on, match:class xwaylandvideobridge

# ueberzugpp disable animations and hyprland flare
windowrule = no_anim on, match:class ueberzug.*
windowrule = no_blur on, match:class ueberzug.*
windowrule = max_size 1 1, match:class ueberzug.*
windowrule = no_initial_focus on, match:class ueberzug.*
windowrule = no_focus on, match:class ueberzug.*

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur on, ignore_alpha 1, match:namespace rofi
layerrule = blur on, ignore_alpha 1, match:namespace kitty
layerrule = blur on, ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, ignore_alpha 1, match:namespace notifications
layerrule = blur on, ignore_alpha 1, match:namespace swaync-notification-window
layerrule = blur on, ignore_alpha 1, match:namespace swaync-control-center
layerrule = blur on, match:namespace logout_dialog
