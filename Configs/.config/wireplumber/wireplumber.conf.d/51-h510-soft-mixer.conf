# HyperX/XiiSound H510-PRO wireless headset: its USB volume control reports a
# bogus 0.39 dB range, so PipeWire turns any volume below 100% into 0 on the
# headset, which its firmware then mishandles (silence, or one side only).
# Do the volume in software instead and leave the headset's own control alone.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-XiiSound_Technology_Corporation_H510-PRO_Wireless_headset*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
